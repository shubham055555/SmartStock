sonar.projectKey=SmartStock
sonar.projectName=SmartStock
sonar.projectVersion=1.0.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src

sonar.test.inclusions=backend/tests/**,frontend/src/test/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/coverage/**,frontend/src/test/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*

sonar.sourceEncoding=UTF-8

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
