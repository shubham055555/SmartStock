# ==========================================
# SonarQube Project Configuration
# SmartStock DevOps & Lab Capstone (ENSP461)
# ==========================================

sonar.projectKey=smartstock-platform
sonar.projectName=SmartStock — Smart Inventory & DevOps Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/test

# Language and encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/coverage/**,**/*.spec.ts

# Test execution and coverage reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Quality Gate requirements
sonar.qualitygate.wait=true
