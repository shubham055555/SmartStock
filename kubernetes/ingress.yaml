apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartstock-ingress
  namespace: smartstock
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: smartstock.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: smartstock-backend
                port:
                  number: 5000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: smartstock-backend
                port:
                  number: 5000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: smartstock-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartstock-frontend
                port:
                  number: 80
