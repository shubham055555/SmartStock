apiVersion: v1
kind: Service
metadata:
  name: smartstock-backend-live
  namespace: smartstock
  labels:
    app: smartstock-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  # Point selector to active environment (blue or green)
  selector:
    app: smartstock-backend
    version: blue
