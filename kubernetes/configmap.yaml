apiVersion: v1
kind: ConfigMap
metadata:
  name: smartstock-config
  namespace: smartstock
data:
  FLASK_ENV: "production"
  PORT: "5000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "smartstock_db"
  CORS_ORIGINS: "*"
  PROMETHEUS_METRICS_ENABLED: "true"
  JWT_ACCESS_TOKEN_EXPIRES_MINUTES: "120"
  AI_LOG_PROVIDER: "deterministic"
