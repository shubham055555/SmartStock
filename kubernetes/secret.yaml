apiVersion: v1
kind: Secret
metadata:
  name: smartstock-secrets
  namespace: smartstock
type: Opaque
stringData:
  # Sensitive credentials injected securely via SecretStore or sealed-secrets
  POSTGRES_USER: "smartstock_user"
  POSTGRES_PASSWORD: "smartstock_secure_k8s_password"
  SECRET_KEY: "smartstock-prod-cluster-secret-key-2026"
  JWT_SECRET_KEY: "smartstock-prod-cluster-jwt-secret-key-2026"
