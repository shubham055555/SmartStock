# ==============================================================================
# SmartStock Ansible Inventory Configuration
# Course: ENSP461 DevOps & Automation Lab
# ==============================================================================

[smartstock_controllers]
# Local deployment demo target
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[smartstock_nodes]
# Target staging / production worker nodes (replace IPs for lab servers)
node1.smartstock.local ansible_host=192.168.1.101 ansible_user=devops
node2.smartstock.local ansible_host=192.168.1.102 ansible_user=devops

[database_servers]
db1.smartstock.local ansible_host=192.168.1.110 ansible_user=devops

[smartstock:children]
smartstock_controllers
smartstock_nodes
database_servers

[smartstock:vars]
app_name=smartstock
app_dir=/opt/smartstock
app_user=smartstock
python_version=3.11
environment_tier=production
