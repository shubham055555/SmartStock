input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "environment" => "production" }
  }

  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_tag => [ "alert_trigger" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "smartstock-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
